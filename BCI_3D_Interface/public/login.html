<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ByteK BCI | Secure Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #0b1120; background-image: radial-gradient(circle at center, #1e293b 0%, #0b1120 100%); color: white; font-family: 'Inter', sans-serif; }
        .login-box { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px); padding: 50px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); width: 350px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-bottom: 10px; font-weight: 800; text-shadow: 0 0 20px rgba(56,189,248,0.3); }
        p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; box-sizing: border-box; font-family: 'Inter'; outline: none; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
        button { width: 100%; padding: 16px; background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56,189,248,0.4); }
        #error-msg { color: #ef4444; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>🧠 ByteK BCI</h1>
    <p>Secure Clinical Access Portal</p>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Authenticate</button>
    <div id="error-msg">Access Denied. Check credentials.</div>
</div>

<script>
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
            localStorage.setItem('bci_role', data.user.role);
            localStorage.setItem('bci_user', data.user.username);

            if (data.user.role === 'clinician') {
                window.location.href = '/dashboard.html';
            } else if (data.user.role === 'doctor') {
                window.location.href = '/history.html';
            }
        } else {
            errorMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
